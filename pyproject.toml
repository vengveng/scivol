[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name            = "scivol"
dynamic         = ["version"]
description     = "Volatility models with exact likelihoods and derivatives on a native C++20 core."
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
authors         = [{ name = "Ivan Khalin" }]
requires-python = ">=3.10"
dependencies    = [
    "numpy>=1.22",
    "scipy>=1.7",
    "joblib>=1.2",
    "tqdm>=4.0",
]
keywords = ["volatility", "garch", "gjr-garch", "econometrics", "time-series", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/vengveng/scivol"
Repository = "https://github.com/vengveng/scivol"
Issues = "https://github.com/vengveng/scivol/issues"

[project.optional-dependencies]
dev = ["jax"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["scivol"]
# The wheel ships the Python package and the compiled scivol._scivolapi.
sdist.exclude = ["localdev", "localdev_*", "build"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "scivol/_version.py"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_i686"
test-command = 'python -c "import numpy as np; from scivol import ARMA, GJRGARCH, EGARCH, StudentT, NormalInverseGaussian, DCC; rng = np.random.default_rng(0); y = 0.01 * rng.standard_t(6, 1500); r = (ARMA(1, 0) + GJRGARCH(1, 1) + StudentT()).fit(y); assert r.success, r.fit_info.warnings; f = r.forecast(5); assert np.all(np.isfinite(f.variance)); e = (EGARCH(1, 1) + NormalInverseGaussian()).fit(y); assert np.all(np.isfinite(e.params)); q = (GJRGARCH(1, 1) + StudentT()).fit(y, method=\"qmle\"); assert np.all(np.isfinite(q.std_errors)); d = DCC(1, 1).fit_from_residuals(rng.standard_normal((800, 3))); assert np.all(np.isfinite(d.theta))"'
