summary = "CRSP panel: localdev/crsp_study/run.py PATHS FIRST LAST on this tree's build; pickles land in localdev/crsp_study/RUNS/"
source = { kind = "git" }
inputs = ["localdev/crsp_study/run.py", "localdev/crsp_study/returns.npy"]
outputs = [{ path = "localdev/crsp_study/*/*.pkl" }]
# The user: full suites and big runs go to the mini (2026-10-30, 2026-11-02); the laptop only while the mini is away.
avoid = ["mbp"]
cost = { cores = { min = 4, max = 8 }, mem_gb = { base = 1, per_core = 0.4 }, minutes = 3 }

[args.paths]
type = "str"
default = "theta,z,automatic"

[args.first]
type = "int"
default = 0

[args.last]
type = "int"
default = 400
help = "9005 is the whole cross-section (about 20 min on 8 workers); a few hundred answers most questions"

[args.runs]
type = "str"
help = "folder under localdev/crsp_study for the pickles, e.g. runs_now"

[bind.default]
env = "export PATH={node.scivol_venv}/bin:$PATH"
probe = "{node.scivol_venv}/bin/python -I -c \"import sys, numpy, nanobind, importlib.util as u; assert not u.find_spec('scivol'), 'scivol is installed in this venv'; print(sys.version.split()[0], numpy.__version__, nanobind.__version__)\" && cmake --version | head -1 && ninja --version"
run = """
cmake -S . -B build/ab -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(command -v python) &&
cmake --build build/ab && cmake --install build/ab --prefix . &&
export PYTHONPATH=$PWD && cd localdev/crsp_study && mkdir -p {runs} &&
RUNS={runs} python run.py {paths} {first} {last} {cores}
"""
