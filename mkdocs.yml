site_name: scivol
site_description: Conditional volatility and copula correlation models in Python
repo_url: https://github.com/vengveng/scivol
docs_dir: docs
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Models:
      - Mean and constant variance: models/mean.md
      - Volatility: models/volatility.md
      - Innovation densities: models/densities.md
      - DCC and CCC: models/dcc.md
  - Estimation: estimation.md
  - Inference: inference.md
  - Forecasting and simulation: forecasting-and-simulation.md
  - Diagnostics: diagnostics.md
  - Model selection: selection.md
  - Multiple series: multiple-series.md
  - Benchmarks: benchmarks.md
  - Python API: api.md
  - References: references.md
# Documentation tooling requires MkDocs and pymdown-extensions.
markdown_extensions:
  - tables
  - fenced_code
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
