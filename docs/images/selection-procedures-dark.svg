<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a64"/></marker></defs>
<rect width="940" height="500" fill="#1a1a19"/>
<text x="210" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#3987e5">General-to-specific</text>
<text x="790" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#199e70">Information criterion</text>
<rect x="70" y="48" width="280" height="50" rx="7" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/>
<text x="210.0" y="70" text-anchor="middle" font-size="13" fill="#f0efec">Start from the largest models</text>
<text x="210.0" y="86" text-anchor="middle" font-size="13" fill="#f0efec">that pass the adequacy checks</text>
<rect x="70" y="132" width="280" height="66" rx="7" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/>
<text x="210.0" y="154" text-anchor="middle" font-size="13" fill="#f0efec">Try each one-step restriction: fit it,</text>
<text x="210.0" y="170" text-anchor="middle" font-size="13" fill="#f0efec">test it (likelihood ratio at 1%)</text>
<text x="210.0" y="186" text-anchor="middle" font-size="13" fill="#f0efec">and check its adequacy</text>
<path d="M 210.0 98 L 210.0 130" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<rect x="130" y="232" width="160" height="34" rx="7" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/>
<text x="210.0" y="254" text-anchor="middle" font-size="13" fill="#f0efec">Restriction accepted?</text>
<path d="M 210.0 198 L 210.0 230" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<path d="M 130 249.0 L 40 249.0 L 40 165.0 L 68 165.0" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<text x="34" y="279.0" font-size="12" fill="#c3c2b7" text-anchor="start">yes: move to</text>
<text x="34" y="294.0" font-size="12" fill="#c3c2b7">the restricted model</text>
<rect x="70" y="316" width="280" height="50" rx="7" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/>
<text x="210.0" y="338" text-anchor="middle" font-size="13" fill="#f0efec">Stop at the models that accept</text>
<text x="210.0" y="354" text-anchor="middle" font-size="13" fill="#f0efec">no further restriction</text>
<path d="M 210.0 266 L 210.0 314" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<text x="218.0" y="294" font-size="12" fill="#c3c2b7" text-anchor="start">no</text>
<rect x="70" y="400" width="280" height="50" rx="7" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/>
<text x="210.0" y="422" text-anchor="middle" font-size="13" fill="#f0efec">Choose the final model with the fewest</text>
<text x="210.0" y="438" text-anchor="middle" font-size="13" fill="#f0efec">parameters; BIC breaks ties</text>
<path d="M 210.0 366 L 210.0 398" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<text x="380" y="66" font-size="12" fill="#c3c2b7">if no start is adequate and</text>
<text x="380" y="81" font-size="12" fill="#c3c2b7">the residuals are autocorrelated:</text>
<text x="380" y="96" font-size="12" fill="#c3c2b7">add an AR lag to the mean and</text>
<text x="380" y="111" font-size="12" fill="#c3c2b7">start again</text>
<path d="M 350 78 L 372 78 L 372 62 L 352 62" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<text x="210" y="476" text-anchor="middle" font-size="12" fill="#c3c2b7">50–95 fits per series on Auto's search</text>
<rect x="660" y="48" width="260" height="34" rx="7" fill="#1a1a19" stroke="#199e70" stroke-width="1.6"/>
<text x="790.0" y="70" text-anchor="middle" font-size="13" fill="#f0efec">Fit every declared model</text>
<rect x="660" y="116" width="260" height="50" rx="7" fill="#1a1a19" stroke="#199e70" stroke-width="1.6"/>
<text x="790.0" y="138" text-anchor="middle" font-size="13" fill="#f0efec">Keep the models that pass</text>
<text x="790.0" y="154" text-anchor="middle" font-size="13" fill="#f0efec">the adequacy checks</text>
<path d="M 790.0 82 L 790.0 114" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<rect x="660" y="200" width="260" height="34" rx="7" fill="#1a1a19" stroke="#199e70" stroke-width="1.6"/>
<text x="790.0" y="222" text-anchor="middle" font-size="13" fill="#f0efec">Rank them by BIC</text>
<path d="M 790.0 166 L 790.0 198" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<rect x="660" y="268" width="260" height="34" rx="7" fill="#1a1a19" stroke="#199e70" stroke-width="1.6"/>
<text x="790.0" y="290" text-anchor="middle" font-size="13" fill="#f0efec">Choose the lowest BIC</text>
<path d="M 790.0 234 L 790.0 266" stroke="#6b6a64" stroke-width="1.4" fill="none" marker-end="url(#head)"/>
<text x="790.0" y="328" text-anchor="middle" font-size="12" fill="#c3c2b7">181 fits per series on Auto's search</text>
<text x="790.0" y="346" text-anchor="middle" font-size="12" fill="#c3c2b7">no model outside the search is reached</text>
</svg>
